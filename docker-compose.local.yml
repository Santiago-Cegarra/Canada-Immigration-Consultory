services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-migration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-migration}
      POSTGRES_DB: ${POSTGRES_DB:-migration_canada}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-migration} -d $${POSTGRES_DB:-migration_canada}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-migration}:${POSTGRES_PASSWORD:-migration}@db:5432/${POSTGRES_DB:-migration_canada}?schema=public
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
